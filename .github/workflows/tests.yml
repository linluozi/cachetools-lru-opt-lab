name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  differential:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Byte-identical differential test (bundled baseline vs patched)
        run: python3 tests/test_diff.py --baseline-src baseline_src --optimized-src src